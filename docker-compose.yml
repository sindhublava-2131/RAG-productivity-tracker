version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cozy_db
    restart: always
    environment:
      POSTGRES_USER: cozy
      POSTGRES_PASSWORD: cozy_pass
      POSTGRES_DB: cozy_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cozy -d cozy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cozy_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://cozy:cozy_pass@db:5432/cozy_db
      # JWT_SECRET_KEY must be provided via .env or the shell; compose fails fast if unset.
      # Generate one with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env or environment}
      - RAG_PROVIDER=ollama
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cozy_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  chroma_data:
