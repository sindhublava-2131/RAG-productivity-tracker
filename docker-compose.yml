version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./cozy_productivity.db
      - JWT_SECRET_KEY=cozy_rag_productivity_tracker_super_secret_key_2026
      - OLLAMA_HOST=http://host.docker.internal:11434/api/generate
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/cozy_productivity.db:/app/cozy_productivity.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
