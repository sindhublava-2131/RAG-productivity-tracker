[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cozy-rag-productivity-tracker-backend"
version = "2.1.0"
description = "Cozy AI Productivity & RAG Intelligence System - FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.30.0",
    "sqlalchemy~=2.0.30",
    "pydantic~=2.8.0",
    "pydantic-settings~=2.4.0",
    "email-validator~=2.2.0",
    "PyJWT~=2.9.0",
    "bcrypt~=4.2.0",
    "python-multipart~=0.0.9",
    "chromadb~=0.5.0",
    "sentence-transformers~=3.0.0",
    "httpx~=0.27.0",
    "alembic~=1.13.0",
    "psycopg2-binary~=2.9.9",
    "orjson~=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.0",
    "pytest-cov~=5.0.0",
    "pytest-asyncio~=0.24.0",
    "ruff~=0.5.0",
    "mypy~=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"auth.py" = ["B008"]
"routes/*.py" = ["B008"]
"alembic/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
files = ["main.py", "auth.py", "database.py", "models.py", "schemas.py", "core", "services", "routes"]

[tool.setuptools.packages.find]
include = ["*"]
