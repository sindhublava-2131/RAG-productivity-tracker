name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend CI (Lint, Typecheck, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest ruff mypy

      - name: Backend Lint (Ruff)
        run: |
          cd backend
          python -m ruff check .

      - name: Backend Typecheck (MyPy)
        run: |
          cd backend
          python -m mypy --config-file pyproject.toml

      - name: Backend Offline Unit & RAG Tests
        run: |
          cd backend
          pytest

  frontend-ci:
    name: Frontend CI (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend Lint (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Frontend Typecheck (TypeScript)
        run: |
          cd frontend
          npm run typecheck

      - name: Frontend Unit Tests (Vitest)
        run: |
          cd frontend
          npm run test

      - name: Frontend Production Build
        run: |
          cd frontend
          npm run build

  docker-smoke-test:
    name: Docker Build & Compose Smoke Test
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: |
          docker compose build

      - name: Start Docker Compose Stack
        run: |
          docker compose up -d

      - name: Wait for Stack Health
        run: |
          for i in {1..30}; do
            BACKEND_HEALTH=$(curl -s http://localhost:8000/health/ready | grep '"status":"ready"' || true)
            FRONTEND_HEALTH=$(curl -s http://localhost:3000/ | grep '<!DOCTYPE html>' || true)
            if [ -n "$BACKEND_HEALTH" ] && [ -n "$FRONTEND_HEALTH" ]; then
              echo "Containers are healthy and responding!"
              exit 0
            fi
            echo "Waiting for services to become healthy ($i/30)..."
            sleep 3
          done
          echo "Healthcheck timed out!"
          docker compose logs
          exit 1

      - name: Execute API Smoke Tests
        run: |
          echo "=== 1. Health Liveness ==="
          curl -f http://localhost:8000/health/live

          echo -e "\n=== 2. Health Readiness ==="
          curl -f http://localhost:8000/health/ready

          echo -e "\n=== 3. Register User ==="
          REGISTER_RES=$(curl -s -X POST http://localhost:8000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"CI User","email":"ci_user@example.com","password":"cipassword123"}')
          TOKEN=$(echo "$REGISTER_RES" | grep -o '"access_token":"[^"]*' | grep -o '[^"]*$')
          echo "Token received: ${TOKEN:0:15}..."

          echo -e "\n=== 4. Create Task ==="
          TASK_RES=$(curl -s -X POST http://localhost:8000/api/tasks \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"title":"CI Pipeline Integration Task","priority":"HIGH","estimated_minutes":30}')
          TASK_ID=$(echo "$TASK_RES" | grep -o '"id":' | head -n1)

          echo -e "\n=== 5. Complete Task ==="
          curl -s -X PUT "http://localhost:8000/api/tasks/1/complete?actual_minutes=25" \
            -H "Authorization: Bearer $TOKEN"

          echo -e "\n=== 6. RAG Query ==="
          curl -s -X POST http://localhost:8000/api/rag/query \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"question":"What tasks have I worked on?"}'

      - name: Stop Docker Compose Stack
        if: always()
        run: |
          docker compose logs
          docker compose down
